<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Forge — 124×124 Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #18181b;
    --border: #2a2a30;
    --accent: #e8ff47;
    --accent-dim: #b8cc2a;
    --text: #f0f0f0;
    --muted: #666;
    --danger: #ff4747;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    gap: 40px;
  }

  header { text-align: center; }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 32px;
    width: 100%;
    max-width: 680px;
  }

  /* Drop Zone */
  #drop-zone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }

  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(232, 255, 71, 0.04);
  }

  #drop-zone .drop-icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
    display: block;
  }

  #drop-zone .drop-label {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  #drop-zone .drop-sub {
    font-size: 0.75rem;
    color: var(--muted);
  }

  #file-input { display: none; }

  /* Preview area */
  #preview-area {
    display: none;
    flex-direction: column;
    gap: 28px;
  }

  .preview-row {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .preview-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .preview-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  #original-preview {
    max-width: 200px;
    max-height: 200px;
    border: 1px solid var(--border);
    border-radius: 2px;
    object-fit: contain;
    background: #111;
  }

  #icon-preview-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* Checkerboard bg for icon */
  .icon-frame {
    background-image:
      linear-gradient(45deg, #333 25%, transparent 25%),
      linear-gradient(-45deg, #333 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #333 75%),
      linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    background-color: #222;
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #icon-canvas {
    image-rendering: pixelated;
    display: block;
  }

  /* Zoom previews */
  .zoom-previews {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .zoom-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .zoom-item canvas {
    image-rendering: pixelated;
    border: 1px solid var(--border);
  }

  .zoom-item .zoom-label {
    font-size: 0.65rem;
    color: var(--muted);
  }

  /* Controls */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .fit-options { display: flex; gap: 8px; }

  .fit-btn {
    flex: 1;
    padding: 8px 4px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    text-align: center;
  }

  .fit-btn:hover { border-color: var(--accent); color: var(--accent); }
  .fit-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 500;
  }

  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #bg-color {
    width: 36px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }

  .bg-presets { display: flex; gap: 6px; }

  .color-preset {
    width: 22px;
    height: 22px;
    border-radius: 2px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .color-preset:hover { transform: scale(1.15); border-color: var(--accent); }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 11px 20px;
    border-radius: 2px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .btn-primary { background: var(--accent); color: #000; font-weight: 500; }
  .btn-primary:hover { background: var(--accent-dim); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--text); color: var(--text); }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0;
  }

  /* Format selector */
  .format-options { display: flex; gap: 8px; }

  .format-btn {
    padding: 6px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .format-btn:hover { border-color: var(--accent); color: var(--accent); }
  .format-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 500; }

  /* Status */
  #status {
    font-size: 0.72rem;
    color: var(--muted);
    text-align: center;
    height: 18px;
  }
  #status.ok  { color: var(--accent); }
  #status.err { color: var(--danger); }

  canvas { display: block; }
</style>
</head>
<body>

<header>
  <h1>Icon <span>Forge</span></h1>
  <p class="subtitle">124 × 124 px · instant export</p>
</header>

<div class="card">
  <!-- Drop Zone -->
  <div id="drop-zone">
    <span class="drop-icon">⬡</span>
    <p class="drop-label">Drop an image here</p>
    <p class="drop-sub">or click to browse · .jpg .jpeg .png .avif supported</p>
    <input type="file" id="file-input" accept="image/jpeg,image/jpg,image/png,.png,image/avif,.avif">
  </div>

  <!-- Preview + Controls (hidden until image loaded) -->
  <div id="preview-area">
    <div class="preview-row">
      <div class="preview-block">
        <span class="preview-label">Original</span>
        <img id="original-preview" alt="original">
      </div>

      <div class="preview-block" style="flex:1; min-width:160px;">
        <span class="preview-label">124 × 124 output</span>
        <div id="icon-preview-container">
          <div class="icon-frame">
            <canvas id="icon-canvas" width="124" height="124"></canvas>
          </div>
          <div class="zoom-previews">
            <div class="zoom-item">
              <canvas id="zoom-2x" width="248" height="248"></canvas>
              <span class="zoom-label">2×</span>
            </div>
            <div class="zoom-item">
              <canvas id="zoom-4x" width="496" height="496"></canvas>
              <span class="zoom-label">4×</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <hr class="divider">

    <!-- Controls -->
    <div class="controls">
      <div class="control-group">
        <span class="control-label">Fit mode</span>
        <div class="fit-options">
          <button class="fit-btn active" data-fit="cover">Cover</button>
          <button class="fit-btn" data-fit="contain">Contain</button>
          <button class="fit-btn" data-fit="stretch">Stretch</button>
        </div>
      </div>

      <div class="control-group" id="bg-group" style="display:none;">
        <span class="control-label">Background color</span>
        <div class="color-row">
          <input type="color" id="bg-color" value="#ffffff">
          <div class="bg-presets">
            <div class="color-preset" style="background:#ffffff" data-color="#ffffff" title="White"></div>
            <div class="color-preset" style="background:#000000" data-color="#000000" title="Black"></div>
            <div class="color-preset" style="background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:6px 6px;background-position:0 0,0 3px,3px -3px,-3px 0;background-color:#fff;" data-color="transparent" title="Transparent"></div>
          </div>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">Export format</span>
        <div class="format-options">
          <button class="format-btn" data-fmt="png">PNG</button>
          <button class="format-btn" data-fmt="jpeg">JPEG</button>
          <button class="format-btn active" data-fmt="ico">ICO</button>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="btn-row">
      <button class="btn btn-primary" id="download-btn">↓ Download Icon</button>
      <button class="btn btn-ghost" id="reset-btn">Reset</button>
    </div>

    <p id="status"></p>
  </div>
</div>

<script>
  // ── Single source of truth for output dimensions ──────────────────────────
  const SIZE = 124;

  const dropZone       = document.getElementById('drop-zone');
  const fileInput      = document.getElementById('file-input');
  const previewArea    = document.getElementById('preview-area');
  const originalPreview = document.getElementById('original-preview');
  const iconCanvas     = document.getElementById('icon-canvas');
  const zoom2x         = document.getElementById('zoom-2x');
  const zoom4x         = document.getElementById('zoom-4x');
  const bgGroup        = document.getElementById('bg-group');
  const bgColor        = document.getElementById('bg-color');
  const statusEl       = document.getElementById('status');

  let currentImage = null;
  let fitMode      = 'cover';
  let exportFormat = 'ico';
  let bgColorVal   = '#ffffff';

  // ── Input validation helper ───────────────────────────────────────────────
  function isSupportedInput(file) {
    if (!file) return false;
    const mime = (file.type || '').toLowerCase();
    const byMime = mime === 'image/jpeg'
                || mime === 'image/jpg'
                || mime === 'image/png'
                || mime === 'image/avif';
    const byExt = /\.(jpe?g|png|avif)$/i.test(file.name || '');
    return byMime || byExt;
  }

  // ── Drop zone ─────────────────────────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (isSupportedInput(f)) loadFile(f);
    else setStatus('Only JPEG, PNG, and AVIF files are supported.', 'err');
  });

  function loadFile(file) {
    if (!file) return;
    if (!isSupportedInput(file)) {
      setStatus('Only JPEG, PNG, and AVIF files are supported.', 'err');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        originalPreview.src = e.target.result;
        dropZone.style.display = 'none';
        previewArea.style.display = 'flex';
        renderIcon();
        setStatus(`Loaded: ${file.name} (${img.width}×${img.height})`, 'ok');
      };
      img.onerror = () => {
        const hint = /\.avif$/i.test(file.name) ? ' Your browser may not support AVIF.' : '';
        setStatus(`This image could not be decoded.${hint}`, 'err');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function renderIcon() {
    if (!currentImage) return;
    const ctx = iconCanvas.getContext('2d');
    ctx.clearRect(0, 0, SIZE, SIZE);

    const needsBg = fitMode === 'contain' || exportFormat === 'jpeg';
    if (needsBg && bgColorVal !== 'transparent') {
      ctx.fillStyle = bgColorVal;
      ctx.fillRect(0, 0, SIZE, SIZE);
    }

    const iw = currentImage.width, ih = currentImage.height;
    let sx = 0, sy = 0, sw = iw, sh = ih;
    let dx = 0, dy = 0, dw = SIZE, dh = SIZE;

    if (fitMode === 'cover') {
      const scale = Math.max(SIZE / iw, SIZE / ih);
      const scaledW = iw * scale, scaledH = ih * scale;
      sx = (scaledW - SIZE) / 2 / scale;
      sy = (scaledH - SIZE) / 2 / scale;
      sw = SIZE / scale;
      sh = SIZE / scale;
    } else if (fitMode === 'contain') {
      const scale = Math.min(SIZE / iw, SIZE / ih);
      dw = iw * scale; dh = ih * scale;
      dx = (SIZE - dw) / 2; dy = (SIZE - dh) / 2;
    }
    // stretch: defaults are correct

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(currentImage, sx, sy, sw, sh, dx, dy, dw, dh);

    updateZoom(zoom2x, SIZE * 2);
    updateZoom(zoom4x, SIZE * 4);
  }

  function updateZoom(zoomCanvas, size) {
    const zCtx = zoomCanvas.getContext('2d');
    zoomCanvas.width = size; zoomCanvas.height = size;
    zCtx.imageSmoothingEnabled = false;
    zCtx.drawImage(iconCanvas, 0, 0, size, size);
  }

  // ── Fit buttons ───────────────────────────────────────────────────────────
  document.querySelectorAll('.fit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fit-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fitMode = btn.dataset.fit;
      bgGroup.style.display = fitMode === 'contain' ? 'flex' : 'none';
      renderIcon();
    });
  });

  // ── Format buttons ────────────────────────────────────────────────────────
  document.querySelectorAll('.format-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      exportFormat = btn.dataset.fmt;
      renderIcon();
    });
  });

  // ── Background color ──────────────────────────────────────────────────────
  bgColor.addEventListener('input', e => { bgColorVal = e.target.value; renderIcon(); });
  document.querySelectorAll('.color-preset').forEach(p => {
    p.addEventListener('click', () => {
      bgColorVal = p.dataset.color;
      if (bgColorVal !== 'transparent') bgColor.value = bgColorVal;
      renderIcon();
    });
  });

  // ── Download ──────────────────────────────────────────────────────────────
  document.getElementById('download-btn').addEventListener('click', () => {
    if (!currentImage) return;
    if (exportFormat === 'ico') {
      downloadAsIco();
    } else {
      const mime = exportFormat === 'jpeg' ? 'image/jpeg' : 'image/png';
      const ext  = exportFormat === 'jpeg' ? 'jpg' : 'png';
      const link = document.createElement('a');
      link.download = `icon_${SIZE}x${SIZE}.${ext}`;
      link.href = iconCanvas.toDataURL(mime, 0.95);
      link.click();
      setStatus('Icon downloaded!', 'ok');
    }
  });

  function downloadAsIco() {
    // ICO container holding a PNG-encoded image (supported by Windows Vista+).
    iconCanvas.toBlob(async pngBlob => {
      if (!pngBlob) { setStatus('Could not encode icon.', 'err'); return; }
      const png = new Uint8Array(await pngBlob.arrayBuffer());
      const buf  = new ArrayBuffer(6 + 16 + png.length);
      const view = new DataView(buf);
      // ICONDIR
      view.setUint16(0, 0, true);
      view.setUint16(2, 1, true);   // type: icon
      view.setUint16(4, 1, true);   // one image
      // ICONDIRENTRY
      view.setUint8(6, SIZE > 255 ? 0 : SIZE);
      view.setUint8(7, SIZE > 255 ? 0 : SIZE);
      view.setUint8(8, 0);
      view.setUint8(9, 0);
      view.setUint16(10, 1, true);
      view.setUint16(12, 32, true);
      view.setUint32(14, png.length, true);
      view.setUint32(18, 22, true);
      new Uint8Array(buf, 22).set(png);

      const blob = new Blob([buf], { type: 'image/x-icon' });
      const link = document.createElement('a');
      link.download = `icon_${SIZE}x${SIZE}.ico`;
      link.href = URL.createObjectURL(blob);
      link.click();
      setStatus('ICO downloaded!', 'ok');
    }, 'image/png');
  }

  // ── Reset ─────────────────────────────────────────────────────────────────
  document.getElementById('reset-btn').addEventListener('click', () => {
    currentImage = null;
    fileInput.value = '';
    previewArea.style.display = 'none';
    dropZone.style.display = 'block';
    setStatus('');
  });

  function setStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className = type;
  }
</script>
</body>
</html>
